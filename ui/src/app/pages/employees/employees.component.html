<div class="card">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>Çalışanlar (Employees)</h2>
    <p-button label="Yeni Ekle" icon="pi pi-plus" (onClick)="showDialog()"></p-button>
  </div>

  <p-table [value]="employees" [paginator]="true" [rows]="10" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>İsim</th>
        <th>Soyisim</th>
        <th>Email</th>
        <th>Unvan</th>
        <th>Departman</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-employee>
      <tr>
        <td>{{employee.id}}</td>
        <td>{{employee.firstName}}</td>
        <td>{{employee.lastName}}</td>
        <td>{{employee.email}}</td>
        <td>{{employee.title}}</td>
        <td>{{employee.department}}</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog header="Yeni Çalışan Ekle" [(visible)]="displayDialog" [style]="{width: '50vw'}">
    <div class="flex flex-column gap-3 mt-3">
      <div class="flex flex-column gap-2">
        <label for="firstName">İsim</label>
        <input pInputText id="firstName" [(ngModel)]="newEmployee.firstName" />
      </div>
      <div class="flex flex-column gap-2">
        <label for="lastName">Soyisim</label>
        <input pInputText id="lastName" [(ngModel)]="newEmployee.lastName" />
      </div>
      <div class="flex flex-column gap-2">
        <label for="email">Email</label>
        <input pInputText id="email" [(ngModel)]="newEmployee.email" />
      </div>
      <div class="flex flex-column gap-2">
        <label for="title">Unvan</label>
        <input pInputText id="title" [(ngModel)]="newEmployee.title" />
      </div>
      <div class="flex flex-column gap-2">
        <label for="department">Departman</label>
        <input pInputText id="department" [(ngModel)]="newEmployee.department" />
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="İptal" icon="pi pi-times" (onClick)="displayDialog=false" styleClass="p-button-text"></p-button>
      <p-button label="Kaydet" icon="pi pi-check" (onClick)="saveEmployee()"></p-button>
    </ng-template>
  </p-dialog>
</div>
